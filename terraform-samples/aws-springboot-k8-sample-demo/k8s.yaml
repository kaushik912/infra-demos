# Deployment + NodePort Service for springboot-k8-sample.
# The app's endpoints map onto the k8s probes:
#   /test/isReady -> readinessProbe (gates Service traffic)
#   /test/isAlive -> livenessProbe  (restarts the container if it fails)
# Image is built on the box and imported into k3s, so never pull from a registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-k8-sample
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-k8-sample
  template:
    metadata:
      labels:
        app: springboot-k8-sample
    spec:
      containers:
        - name: app
          image: springboot-k8-sample:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /test/isAlive
              port: 8080
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /test/isReady
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /test/isAlive
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-k8-sample
spec:
  type: NodePort
  selector:
    app: springboot-k8-sample
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
