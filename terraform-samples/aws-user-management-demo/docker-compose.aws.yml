# Overlay on the app's docker-compose.yml. Only changes what the AWS demo needs:
# real SMTP (Brevo, creds from .env), no host ports for MySQL/Redis, quieter logs,
# minimal actuator exposure.
# Run: docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
services:
  mysql:
    ports: !override []
  redis:
    ports: !override []
  app:
    environment:
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_COM_HENDISANTIKA: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
