name: aws-s3-demo terraform

on:
  push:
    branches: [master]
    paths:
      - 'terraform-samples/aws-s3-demo/**'
      - '.github/workflows/aws-s3-demo.yml'
  pull_request:
    paths:
      - 'terraform-samples/aws-s3-demo/**'
      - '.github/workflows/aws-s3-demo.yml'
  workflow_dispatch:

# Serializes runs so two workflow triggers can't both hold the S3 state
# lock at once — belt-and-suspenders alongside the backend's own
# use_lockfile locking.
concurrency:
  group: aws-s3-demo-state
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write # to comment the plan on the PR

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-samples/aws-s3-demo
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - uses: hashicorp/setup-terraform@v3

      - name: 'terraform init'
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: 'terraform plan'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: 'terraform show (readable plan for the PR comment)'
        run: terraform show -no-color tfplan > plan.txt

      - name: 'Comment plan on PR'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform-samples/aws-s3-demo/plan.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform plan: aws-s3-demo\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\``
            });

      - name: 'terraform apply'
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: terraform apply -input=false tfplan
