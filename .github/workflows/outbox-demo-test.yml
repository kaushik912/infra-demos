name: outbox-demo test

on:
  push:
    branches: [master]
    paths:
      - 'outbox-demo/**'
      - '.github/workflows/outbox-demo-test.yml'
  pull_request:
    paths:
      - 'outbox-demo/**'
      - '.github/workflows/outbox-demo-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outbox-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests (Testcontainers: Postgres + Kafka)
        run: mvn -B test
