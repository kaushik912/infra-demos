spring.application.name=debezium-cdc-demo

# --- Postgres (compose.yaml, host port 5433) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/debezium
spring.datasource.username=postgres
spring.datasource.password=postgres
# update, NOT create-drop: dropping the table on shutdown breaks the Debezium publication
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Kafka (host listener) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=policy-cdc-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

logging.level.com.example.cdc=INFO
